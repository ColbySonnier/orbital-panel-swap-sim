seed: 42
demo_mode: true

orbit:
  alt_km: 550
  inc_deg: 97.6
  raan_deg: 90
  arg_lat_deg: 0
  mu_km3s2: 398600.4418
  r_earth_km: 6378.137
  epoch: "2027 MARCH 20 12:00:00.0 (UTC)"

client:
  bus_size_m: 4.0
  bus_mass_kg: 5000
  bus_offset_m: 4.0
  truss_mass_kg: 400
  module_mass_kg: 12
  grid: 8
  slot_m: 2.0
  module_thick_m: 0.05
  grapple_gap_m: 0.05     # grapple point behind a module's back face
  bus_slots: [[4, 4], [4, 5], [5, 4], [5, 5]]
  target: [2, 7]
  keepout_m: 15
  cone_half_deg: 10
  cone_len_m: 20

power:
  solar_flux: 1361
  eff: 0.30
  area_m2: 4.0
  aging: 0.88
  noise: 0.01
  strike_t_s: 600
  strike_frac_remaining: 0.35
  degraded: 0.85
  failed: 0.50
  service: 0.70
  persist_s: 60
  checkout_band: [0.98, 1.20]

servicer:
  mass_kg: 250
  inertia: [30, 40, 40]   # x is the 1.2 m long axis
  size_m: [1.2, 1.0, 1.0]  # bus box (x, y, z), centered at the CoM; +x is the arm face
  prop_kg: 15
  isp_s: 220
  max_thrust_n: 2.0

waypoints:
  H0: [0, -2000, 0]
  H1: [0, -200, 0]
  H2: [0, -30, 0]
  W3_offset_m: 20
  H3_offset_m: 20
  berth_offset_m: 2.6

speeds:
  leg_mps: 0.05
  accel_mps2: 0.001
  final_mps: 0.02
  slow_zone_m: 10

control:
  wn: 0.02
  zeta: 0.9

# Hold durations in seconds. The loader flattens each to the active value.
holds_s:
  go: {demo: 60, full: 600}
  H1: {demo: 120, full: 900}
  H2: {demo: 300, full: 5736}
  H3: {demo: 60, full: 600}
  berth: {demo: 60, full: 300}
  checkout: {demo: 60, full: 300}

# Exit tolerances for a station: position error (m) and speed (m/s).
# H0/H1/H2 are checked in Hill; H3 and berth in the array frame A.
# The departure's H2-equivalent uses H2.
tolerances:
  H0: {pos_m: 5.0, vel_mps: 0.02}
  H1: {pos_m: 5.0, vel_mps: 0.02}
  H2: {pos_m: 0.5, vel_mps: 0.01}
  H3: {pos_m: 0.2, vel_mps: 0.005}
  berth: {pos_m: 0.05, vel_mps: 0.005}

# Per-phase timeouts (s), about 2x the nominal phase length; null = none.
# On a timeout the manager keeps flying and labels Command.sub "timeout".
# Flattened by the loader like holds_s.
phase_timeout_s:
  monitoring: null
  go: {demo: 300, full: 1200}
  far: {demo: 6000, full: 8000}
  inspection: {demo: 6500, full: 17500}
  back_side: {demo: 2500, full: 3500}
  final: {demo: 1500, full: 2000}
  exchange: {demo: 7200, full: 7200}
  checkout: {demo: 600, full: 900}
  departure: {demo: 15000, full: 16000}
  home: null

arm:
  links_m: [1.1, 1.1, 0.3]
  limit_deg: 170
  rate_dps: 2.0
  tip_free_mps: 0.02
  tip_contact_mps: 0.01
  shoulder_m: [0.9, 0.0, 0.0]  # on a 0.3 m pedestal off the front-face center
  rack:                        # spares on top (+z), stow on the bottom (-z)
    x_m: -0.6                  # panel center x; front edge at x = 0.4
    z0_m: 0.55                 # innermost panel center |z|
    dz_m: 0.08                 # spacing outward
    standoff_m: 0.10           # lift-off from a slot
    spare_slot: 3
    stow_slot: 4
  approach_m: 0.10             # tool standoff before capture / after release
  pull_m: 0.50                 # extract / insert stroke at the array
  retract_m: 0.80              # 6.12 straight draw-back before stowing
  latch_s: 10.0                # latch / grapple actuation holds
  step_min: [1, 6, 2, 3, 2, 10, 6, 10, 2, 3, 2, 6]  # 6.1-6.12

viz:
  save_file: "outputs/servicer_demo.bin"
  rate_s: 1.0
  ambient: 0.35
  park_m: 1000             # hidden bodies park this far radially below the client
  blend_s: 180             # servicer attitude blend, camera-at-client <-> berth

dyn:
  dt_far_s: 1.0
  dt_near_s: 0.1
  near_m: 200
  far_hysteresis: 1.25     # back to dt_far above far_hysteresis * near_m
  fsw_s: 0.5               # FSW task period (glue acts every max(fsw_s, dt))

run:
  chunk_s: 10              # outer loop step: dt switching and stop check
  home_tail_s: 600         # keep flying this long after reaching Home
  t_max_s: 60000           # hard stop

budget:
  dv_mps: 6.0
