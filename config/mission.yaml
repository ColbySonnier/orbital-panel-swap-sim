seed: 42
demo_mode: true

orbit:
  alt_km: 550
  inc_deg: 97.6
  raan_deg: 90
  arg_lat_deg: 0
  mu_km3s2: 398600.4418
  r_earth_km: 6378.137
  epoch: "2027 MARCH 20 12:00:00.0 (UTC)"

client:
  bus_size_m: 4.0
  bus_mass_kg: 5000
  bus_offset_m: 4.0
  truss_mass_kg: 400
  module_mass_kg: 12
  grid: 8
  slot_m: 2.0
  module_thick_m: 0.05
  grapple_gap_m: 0.05     # grapple point behind a module's back face
  module_gap_m: 0.015     # visual gap between a module edge and its slot edge
  bus_slots: [[4, 4], [4, 5], [5, 4], [5, 5]]
  target: [2, 7]

power:
  solar_flux: 1361
  eff: 0.30
  area_m2: 4.0
  aging: 0.88
  noise: 0.01
  strike_t_s: 600
  strike_frac_remaining: 0.35
  degraded: 0.85
  failed: 0.50
  service: 0.70
  persist_s: 60
  checkout_band: [0.98, 1.20]

# Hold durations in seconds. The loader flattens each to the active value.
# checkout starts at the gantry's `latched` event. The demo value outlasts the
# rest of the swap (latched -> retract done, ~86 s), so phase 3 shows the gantry
# holding still before the green overlay.
holds_s:
  go: {demo: 60, full: 600}
  checkout: {demo: 120, full: 300}

# On-board rail gantry (docs/superpowers/specs/2026-11-19-rail-gantry-design.md).
# All positions in array frame A (m); +z toward the Sun, the back side is -z.
gantry:
  rail_y: 8.6               # rails along x at y = +-rail_y
  rail_z: -2.0
  bridge_z: -2.0            # bridge center line
  park_x: {A: -8.6, B: 8.6}
  x_limits: {A: [-8.6, -2.6], B: [2.6, 8.6]}
  bay_pitch: 2.1            # bay W / bay F spacing in y
  bay_z0: -1.25             # bottom magazine panel center z
  stack_dz: 0.17            # fresh-stack pitch: thick + grapple gap + fork F head and crossbar + 0.015
  n_fresh: 4
  travel_mps: 0.05          # bridge and carriage
  fork_mps: 0.02
  contact_mps: 0.01         # within contact_zone_m of a grapple / seat contact
  contact_zone_m: 0.10
  accel_mps2: 0.005
  latch_s: 10
  settle_s: 5
  release_clear_m: 0.02     # release_client once the front face is this far past the back of the slot
  # Builder choices (task G1):
  bridge_size: [0.3, 0.3]   # bridge beam cross-section (x, z); length spans the rails
  carriage_size: [2.2, 4.3, 0.15] # carriage plate (x, y, z), centered at carriage_z
  magazine_top_z: -1.85     # back (-z) end of the magazine, the carriage's +z face
  carriage_z: -1.925        # midpoint of bridge_z and magazine_top_z
  carriage_park_y: 0.0
  waste_side: -1            # bay W at carriage_y + waste_side * bay_pitch / 2, bay F opposite
  fork_W_head:              # center grapple head, fork frame (origin at the tip, A axes)
    size: [0.2, 0.2, 0.06]
    offset: [0.0, 0.0, -0.03]   # head sits behind (-z of) the tip
  # Telescoping members run from offset z (fork frame) back to magazine_top_z.
  fork_W_mast: {size: [0.06, 0.06], offset: [0.0, 0.0, -0.06]}        # (x, y) section
  fork_F_head: {size: [0.2, 0.2, 0.015], offset: [0.0, 0.0, -0.0075]}
  fork_F_crossbar: {size: [2.14, 0.2, 0.04], offset: [0.0, 0.0, -0.035]}  # behind the held panel
  fork_F_arm: {size: [0.04, 0.2], offset: [1.05, 0.0, -0.055]}      # (x, y) section; mirrored to -x
  # Telescoping stages (task G2). Each fork's mast (W) / arm pair (F) is drawn as nested
  # stages: stage 1 (widest) is fixed with its top on the carriage's +z face
  # (magazine_top_z); the last stage is socketed into its head. Stage count = list length.
  # 3 stages cannot cover the 1.25 m stroke inside the 0.47 m retracted gap with
  # 0.05 m overlaps (see stage_layout), so 4 are used.
  rail_section: [0.10, 0.14]  # rail extrusion (y, z); bridge wheels run on its z faces
  rail_end_margin_m: 0.6    # rail runs this far past the farthest park_x (trucks + end stops)
  stage_overlap_m: 0.05     # min overlap of neighbouring stages, retracted to extended
  stage_socket_m: 0.02      # last stage runs this far into its head (W) / crossbar (F)
  fork_W_stages: [[0.105, 0.105], [0.09, 0.09], [0.075, 0.075], [0.06, 0.06]]  # (x, y) sections, stage 1 first
  fork_F_stages: [[0.064, 0.26], [0.056, 0.24], [0.048, 0.22], [0.04, 0.2]]    # per arm (x = +-fork_F_arm x)

viz:
  save_file: "outputs/servicer_demo.bin"
  rate_s: 1.0
  # The gantry works on the array's shadowed back side (-z_A, away from the Sun).
  # 0.55 lifts the unlit hardware enough to read its textures; the sunlit cell
  # face is still clearly brighter. 0.35 (free-flyer value) left the back dark.
  ambient: 0.55
  park_m: 1000             # hidden overlays park this far along -z_A from the slot
  # Red/green slot overlay: a glowing outline frame, open centre, in the module
  # frame (half-widths from the slot centre, z in m). back: four bars just behind
  # the truss top grid (tube bottom -0.077) and just above fork F's crossbar at the
  # slot (top -0.090); each bar stops `end` from the slot centre to clear the grid
  # nodes, keel verticals and keel diagonals at the corners. front: a full rim on
  # the sun side, 1 mm proud of the cell faces. Both stay outside the 0.985 m panel
  # half-width, so the panels and forks pass through the open centre.
  overlay_frame:
    back:  {inner: 0.99, outer: 1.20, z: [-0.088, -0.083], end: 0.85}
    front: {inner: 0.988, outer: 1.06, z: [0.026, 0.032]}
  # Client-mounted standard cameras: eye and aim point in array frame A (m).
  # Earth sits in the array plane on the -y_A side during the swap (terminator
  # orbit), so the wide view looks from behind and +y, 60 deg off the
  # mid-swap Earth direction: the Earth limb stays in frame the whole run.
  cameras:
    wide:    {eye_A: [11.5, 30.0, -44.0], target_A: [0.0, 0.0, -1.0], fov_deg: 40}
    gantry:  {eye_A: [13.0, -16.0, -9.0], target_A: [5.0, -3.0, -1.0], fov_deg: 55}
    closeup: {eye_A: [9.5, -7.5, -2.6], target_A: [5.0, -5.0, -0.7], fov_deg: 60}
  # Spotlight on the client aimed at slot M(2,7) from behind (Vizard 2.4 Light).
  work_light: {pos_A: [5.0, -11.0, -5.0], target_A: [5.0, -5.0, -0.5], fov_deg: 70,
               range_m: 20, intensity: 1.5}

run:
  dt_s: 1.0                # client dynamics, FSW glue and gantry clock step
  chunk_s: 10              # outer loop step (stop check)
  home_tail_s: 120         # phase 5 Done: keep flying this long, then stop
  t_max_s: 6000            # hard stop
